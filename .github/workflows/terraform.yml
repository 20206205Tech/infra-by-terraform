name: Terraform Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    # paths:
    #   - "terraform/**"
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform Workflow
    runs-on: ubuntu-latest

    # defaults:
    #   run:
    #     working-directory: ./terraform

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      TF_VAR_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      TF_VAR_DOPPLER_PROJECT: ${{ secrets.DOPPLER_PROJECT }}
      TF_VAR_DOPPLER_CONFIG: ${{ secrets.DOPPLER_CONFIG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Terraform Plugin Cache Dir
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Fetch secrets from Doppler
        id: doppler    
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ secrets.DOPPLER_PROJECT }}
          doppler-config: ${{ secrets.DOPPLER_CONFIG }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
  
          cli_config_credentials_token: ${{ steps.doppler.outputs.TF_API_TOKEN }} 

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false